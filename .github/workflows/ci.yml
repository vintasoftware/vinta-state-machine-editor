name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # jsdom needs >= 22.22, vite/rolldown >= 22.12; older Node cannot run the tooling.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run coverage

      - name: Build
        run: npm run build

      # dist/bundled.js is the no-bundler route: one file, no bare specifiers.
      # A config change that breaks that only shows up on the host, so assert it here.
      - name: Verify the bundled entry point
        run: npm run verify:bundled

      - name: Upload coverage
        if: matrix.node == '24'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
